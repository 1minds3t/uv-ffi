[package]
name = "uv-ffi"
version = "0.10.8"
edition = "2021"
description = "Persistent in-process execution engine for uv's package resolver — internal dependency of omnipkg"
readme = "README.md"
homepage = "https://github.com/1minds3t/uv-ffi"
repository = "https://github.com/1minds3t/uv-ffi"
documentation = "https://github.com/1minds3t/uv-ffi#readme"
license = "MIT"
authors = ["1minds3t"]
keywords = ["uv", "packaging", "ffi", "resolver", "omnipkg"]
categories = ["development-tools", "api-bindings"]
exclude = ["/tests", "/.github"]
