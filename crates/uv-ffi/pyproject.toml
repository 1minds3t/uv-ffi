[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "uv-ffi"
version = "0.10.8.post4"
description = "Persistent in-process execution engine for uv — internal dependency of omnipkg"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "1minds3t" }]
keywords = ["uv", "packaging", "ffi", "pip", "omnipkg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/1minds3t/omnipkg"
"Source Code" = "https://github.com/1minds3t/omnipkg"

[tool.maturin]
module-name = "uv_ffi.uv_ffi"