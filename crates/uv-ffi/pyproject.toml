[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "uv-ffi"
version = "0.10.8"
description = "Persistent in-process execution engine for uv — internal dependency of omnipkg"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "1minds3t" }]
keywords = ["uv", "packaging", "ffi", "pip", "omnipkg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/1minds3t/uv-ffi"
"Source Code" = "https://github.com/1minds3t/uv-ffi"
"Bug Tracker" = "https://github.com/1minds3t/uv-ffi/issues"
Omnipkg = "https://pypi.org/project/omnipkg/"
"Extended Wheels" = "https://1minds3t.github.io/uv-ffi/"

[tool.maturin]
module-name = "uv_ffi.uv_ffi"
python-packages = ["python/uv_ffi"]
include = ["LICENSE-MIT", "NOTICE"]

