name: "🔧 Build uv-ffi Wheels"
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
        tag:
          description: 'Tag to build (e.g. v0.10.7)'
          required: false
          default: ''

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          
      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version' crates/uv-ffi/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          fi
          PYVER="cp$( echo "${{ matrix.python }}" | tr -d '.' )"
          TARGET="${{ matrix.target }}"
          VERSION_TAG="${VERSION}"
          WHEEL="uv_ffi-${VERSION_TAG}-${PYVER}-${PYVER}-manylinux_2_28_${TARGET}.whl"
          echo "Checking PyPI for $WHEEL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://files.pythonhosted.org/packages/source/u/uv-ffi/${WHEEL}")
          if [ "$STATUS" = "200" ]; then
            echo "Wheel $WHEEL already on PyPI - skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            STATUS2=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" | python3 -c "import sys,json; files=[f['filename'] for f in json.load(sys.stdin).get('urls',[])]; print('found' if '${WHEEL}' in files else 'missing')" 2>/dev/null)
            if [ "$STATUS2" = "found" ]; then
              echo "Wheel $WHEEL already on PyPI - skipping build"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Wheel $WHEEL not on PyPI - proceeding"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi
          
      - name: Build wheel
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out ${{ github.workspace }}/wheels/ --interpreter python${{ matrix.python }}
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          
      - uses: actions/upload-artifact@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          name: wheels-linux-${{ matrix.target }}-py${{ matrix.python }}
          path: wheels/

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14, macos-15-intel]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          
      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version' crates/uv-ffi/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          fi
          PYVER="cp$( echo "${{ matrix.python }}" | tr -d '.' )"
          OS="${{ matrix.os }}"
          VERSION_TAG="${VERSION}"
          if [[ "$OS" == "macos-15-intel" ]]; then
            WHEEL="uv_ffi-${VERSION_TAG}-${PYVER}-${PYVER}-macosx_10_12_x86_64.whl"
          else
            WHEEL="uv_ffi-${VERSION_TAG}-${PYVER}-${PYVER}-macosx_11_0_arm64.whl"
          fi
          echo "Checking PyPI for $WHEEL..."
          PYPI_FILES=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" | python3 -c "import sys,json; files=[f['filename'] for f in json.load(sys.stdin).get('urls',[])]; print('found' if '${WHEEL}' in files else 'missing')" 2>/dev/null)
          if [ "$PYPI_FILES" = "found" ]; then
            echo "Wheel $WHEEL already on PyPI - skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Wheel $WHEEL not on PyPI - proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Build wheel
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          args: --release --out ${{ github.workspace }}/wheels/ --interpreter python${{ matrix.python }}
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          
      - uses: actions/upload-artifact@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: wheels/

  setup-windows-python:
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Check if Python already installed
        id: check
        shell: powershell
        run: |
          $missing = @("38","39","310","311","312","313") | Where-Object { -not (Test-Path "C:\Python$_\python.exe") }
          if ($missing.Count -eq 0) {
            echo "all_installed=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "all_installed=false" >> $env:GITHUB_OUTPUT
            Write-Host "Missing: $($missing -join ', ')"
          }
          
      - name: Install all Python versions
        if: steps.check.outputs.all_installed != 'true'
        shell: powershell
        run: |
          $versions = @(
            @{ver="3.8.20";  short="38"},
            @{ver="3.9.13";  short="39"},
            @{ver="3.10.11"; short="310"},
            @{ver="3.11.9";  short="311"},
            @{ver="3.12.9";  short="312"},
            @{ver="3.13.2";  short="313"},
            @{ver="3.14.0a6";short="314"}
          )
          foreach ($p in $versions) {
            $dest = "C:\Python$($p.short)"
            if (Test-Path "$dest\python.exe") {
              Write-Host "Python $($p.ver) already installed at $dest"
              continue
            }
            $v = $p.ver
            if ($v -like "*a*") {
              $url = "https://www.python.org/ftp/python/3.14.0/python-3.14.0a6-amd64.exe"
            } else {
              $url = "https://www.python.org/ftp/python/$v/python-$v-amd64.exe"
            }
            Write-Host "Downloading Python $v from $url"
            Invoke-WebRequest $url -OutFile "$env:TEMP\python-install.exe"
            Start-Process "$env:TEMP\python-install.exe" -ArgumentList "/quiet InstallAllUsers=0 TargetDir=$dest PrependPath=0 Include_launcher=0" -Wait
            Remove-Item "$env:TEMP\python-install.exe" -Force -ErrorAction SilentlyContinue
            Write-Host "Installed Python $v at $dest"
          }

  build-windows:
    runs-on: [self-hosted, windows, x64]
    needs: setup-windows-python
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            pypath: 'C:\Python38\python.exe'
          - python: "3.9"
            pypath: 'C:\Python39\python.exe'
          - python: "3.10"
            pypath: 'C:\Python310\python.exe'
          - python: "3.11"
            pypath: 'C:\Python311\python.exe'
          - python: "3.12"
            pypath: 'C:\Python312\python.exe'
          - python: "3.13"
            pypath: 'C:\Python313\python.exe'
          - python: "3.14"
            pypath: 'C:\Python314\python.exe'
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Add MSVC to PATH
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          echo PATH=%PATH% >> %GITHUB_ENV%
          echo INCLUDE=%INCLUDE% >> %GITHUB_ENV%
          echo LIB=%LIB% >> %GITHUB_ENV%
          echo LIBPATH=%LIBPATH% >> %GITHUB_ENV%

      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $version = if ($tag) { $tag.TrimStart("v") } else { (Select-String -Path "crates\uv-ffi\pyproject.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value }
          $pyver = "cp" + ("${{ matrix.python }}" -replace '\.', '')
          $wheel = "uv_ffi-${version}-${pyver}-${pyver}-win_amd64.whl"
          Write-Host "Checking PyPI for $wheel..."
          try { $response = Invoke-RestMethod "https://pypi.org/pypi/uv-ffi/$version/json" -ErrorAction Stop } catch { $response = $null }
          $files = if ($response) { $response.urls.filename } else { @() }
          if ($files -contains $wheel) {
            Write-Host "Wheel $wheel already on PyPI - skipping build"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Wheel $wheel not on PyPI - proceeding"
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build wheel
        if: steps.pypi_check.outputs.skip == 'false'
        shell: powershell
        run: |
          $env:RUSTUP_HOME = "C:\rustup-home"
          $env:CARGO_HOME = "C:\cargo-home"
          $env:PATH = "C:\cargo-home\bin;" + $env:PATH
          C:\Python313\python.exe -m maturin build --release --out "${{ github.workspace }}\wheels" --interpreter ${{ matrix.pypath }} --manifest-path crates/uv-ffi/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - uses: actions/upload-artifact@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          name: wheels-windows-py${{ matrix.python }}
          path: wheels/

  build-windows-arm64:
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pypath: 'python'
          - python: "3.12"
            pypath: 'python'
          - python: "3.13"
            pypath: 'python'
          - python: "3.14"
            pypath: 'python'
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          
      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          $version = if ($tag) { $tag.TrimStart("v") } else { (Select-String -Path "crates\uv-ffi\pyproject.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value }
          $pyver = "cp" + ("${{ matrix.python }}" -replace '\.', '')
          $vtag = $version
          $wheel = "uv_ffi-${vtag}-${pyver}-${pyver}-win_arm64.whl"
          Write-Host "Checking PyPI for $wheel..."
          try { $response = Invoke-RestMethod "https://pypi.org/pypi/uv-ffi/$version/json" -ErrorAction Stop } catch { $response = $null }
          $files = if ($response) { $response.urls.filename } else { @() }
          if ($files -contains $wheel) {
            Write-Host "Wheel $wheel already on PyPI - skipping build"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Wheel $wheel not on PyPI - proceeding"
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build wheel
        if: steps.pypi_check.outputs.skip == 'false'
        shell: powershell
        run: |
          python -m pip install maturin
          python -m maturin build --release --out "${{ github.workspace }}\wheels" --manifest-path crates/uv-ffi/Cargo.toml
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          
      - uses: actions/upload-artifact@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          name: wheels-windows-arm64-py${{ matrix.python }}
          path: wheels/
