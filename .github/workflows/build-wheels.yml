name: "🔧 Build uv-ffi Wheels"

on:
  push:
    branches: [omnipkg-ffi-v0.10.8]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install cibuildwheel==2.22.0

      - name: Build wheels
        working-directory: crates/uv-ffi
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-win32 *-musllinux* pp*"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "quay.io/pypa/manylinux_2_28_aarch64"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && source $HOME/.cargo/env"
          CIBW_BEFORE_BUILD: "pip install maturin"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: >
            PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
            PATH="$HOME/.cargo/bin:$PATH"
        run: python -m cibuildwheel --output-dir ${{ github.workspace }}/wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheels/
          retention-days: 7

  commit-to-omnipkg:
    name: Commit wheels to omnipkg
    needs: build-wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: 1minds3t/omnipkg
          ref: development
          ssh-key: ${{ secrets.OMNIPKG_DEPLOY_KEY }}
          path: omnipkg

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: new-wheels/

      - name: Replace wheels in omnipkg
        run: |
          mkdir -p omnipkg/src/omnipkg/_vendor/wheels/
          rm -f omnipkg/src/omnipkg/_vendor/wheels/*.whl
          cp new-wheels/*.whl omnipkg/src/omnipkg/_vendor/wheels/
          ls -lh omnipkg/src/omnipkg/_vendor/wheels/

      - name: Commit and push
        run: |
          cd omnipkg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/omnipkg/_vendor/wheels/
          git commit -m "chore(wheels): update uv-ffi wheels from uv-ffi@${{ github.sha }}"
          git push
