name: "🔧 Build uv-ffi Wheels"

on:
  push:
    branches: [omnipkg-ffi-v0.10.8]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out ${{ github.workspace }}/wheels/ --interpreter python${{ matrix.python }}
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-py${{ matrix.python }}
          path: wheels/

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          args: --release --out ${{ github.workspace }}/wheels/ --interpreter python${{ matrix.python }}
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python }}
          path: wheels/

  build-windows:
    runs-on: [self-hosted, windows, x64]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          args: --release --out ${{ github.workspace }}/wheels/
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py${{ matrix.python }}
          path: wheels/

  commit-to-omnipkg:
    name: Commit wheels to omnipkg
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 1minds3t/omnipkg
          ref: development
          ssh-key: ${{ secrets.OMNIPKG_DEPLOY_KEY }}
          path: omnipkg

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: new-wheels/

      - name: Replace wheels in omnipkg
        run: |
          mkdir -p omnipkg/src/omnipkg/_vendor/wheels/
          rm -f omnipkg/src/omnipkg/_vendor/wheels/*.whl
          cp new-wheels/*.whl omnipkg/src/omnipkg/_vendor/wheels/
          echo "## Wheels built:" && ls -lh omnipkg/src/omnipkg/_vendor/wheels/

      - name: Commit and push
        run: |
          cd omnipkg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/omnipkg/_vendor/wheels/
          git commit -m "chore(wheels): update uv-ffi wheels from uv-ffi@${{ github.sha }}"
          git push
