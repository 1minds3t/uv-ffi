name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.10.8) — uses existing build-wheels artifacts'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-ffi
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Resolve tag and find build-wheels run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On release trigger: use the release tag
          # On manual trigger: use input tag, or fall back to latest release tag
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            echo "No tag specified, using latest release: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

          # Find build-wheels run that matches this tag (check recent runs)
          echo "Searching for completed build-wheels run for tag $TAG..."
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/build-wheels.yml/runs?per_page=20" \
            --jq ".workflow_runs[] | select(.head_branch == \"$TAG\" or .display_title == \"$TAG\" or (.head_commit.message | test(\"$TAG\"))) | .id" \
            2>/dev/null | head -1)

          # Fallback: just grab the most recent successful one
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "  Tag match not found, trying most recent successful run..."
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build-wheels.yml/runs?status=success&per_page=5" \
              --jq '.workflow_runs[0].id' 2>/dev/null)
          fi

          echo "build_run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Found build-wheels run: $RUN_ID"

      - name: Wait for build-wheels to complete (release trigger only)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ steps.resolve.outputs.build_run_id }}"
          echo "Polling build-wheels run $RUN_ID (no timeout)..."
          INTERVAL=30
          ELAPSED=0
          while true; do
            STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
              --jq '.status' 2>/dev/null)
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
              --jq '.conclusion // ""' 2>/dev/null)
            echo "  [${ELAPSED}s] status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                ARTIFACT_COUNT=$(gh api \
                  "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
                  --jq '.total_count' 2>/dev/null)
                echo "  Artifacts found: $ARTIFACT_COUNT"
                if [ "$ARTIFACT_COUNT" -gt "0" ]; then
                  echo "✅ Wheels ready! Total wait: ${ELAPSED}s"
                  break
                fi
              else
                echo "❌ build-wheels failed: $CONCLUSION"
                exit 1
              fi
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

      - name: Verify artifacts exist (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ steps.resolve.outputs.build_run_id }}"
          ARTIFACT_COUNT=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '.total_count' 2>/dev/null)
          echo "Artifacts found in run $RUN_ID: $ARTIFACT_COUNT"
          if [ "$ARTIFACT_COUNT" -eq "0" ]; then
            echo "❌ No artifacts found for run $RUN_ID"
            exit 1
          fi
          echo "✅ $ARTIFACT_COUNT artifacts ready to publish"

      - name: Download wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels.yml
          run_id: ${{ steps.resolve.outputs.build_run_id }}
          name: wheels-*
          name_is_regexp: true
          merge_multiple: true
          path: dist/
          if_no_artifact_found: fail

      - name: List wheels
        run: |
          echo "Wheels to publish:"
          ls -lh dist/

      - name: Publish via OIDC (trusted publisher)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish via API token (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
