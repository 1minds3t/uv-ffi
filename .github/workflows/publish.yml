name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.10.8.post4) — uses existing build-wheels artifacts'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build-sdist:
    name: "📦 Source Distribution"
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      reuse_run_id: ${{ steps.pypi_check.outputs.reuse_run_id }}
    steps:
      - name: Check PyPI and previous runs for existing sdist
        id: pypi_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          SDIST="uv_ffi-${VERSION}.tar.gz"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Checking PyPI for $SDIST..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/uv-ffi/$VERSION/json")
          if [ "$HTTP" = "200" ]; then
            FOUND=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" | python3 -c "
          import sys,json; files=[f['filename'] for f in json.load(sys.stdin).get('urls',[])]
          print('found' if '${SDIST}' in files else 'missing')" 2>/dev/null)
            if [ "$FOUND" = "found" ]; then
              echo "sdist $SDIST already on PyPI - skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "Not on PyPI - checking previous publish workflow runs for reusable sdist artifact..."
          PREV_RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/publish.yml/runs?per_page=20" \
            --jq ".workflow_runs[] | .id" 2>/dev/null | while read -r RID; do
              HAS=$(gh api "repos/${{ github.repository }}/actions/runs/$RID/artifacts?per_page=10" \
                --jq ".artifacts[] | select(.name == \"sdist\") | .id" 2>/dev/null | head -1)
              if [ -n "$HAS" ]; then echo "$RID"; break; fi
            done | head -1)
          if [ -n "$PREV_RUN" ]; then
            echo "Found reusable sdist in previous run $PREV_RUN - skipping rebuild"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reuse_run_id=$PREV_RUN" >> $GITHUB_OUTPUT
          else
            echo "No existing sdist found - will build"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build sdist
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          command: sdist
          args: --out ${{ github.workspace }}/sdist/

      - uses: actions/upload-artifact@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          name: sdist
          path: sdist/

  pypi-publish:
    needs: build-sdist
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-ffi
    permissions:
      id-token: write
      actions: write
    steps:
      - name: Checkout current workflow from HEAD
        uses: actions/checkout@v4
        with:
          ref: omnipkg-ffi-v0.10.8
          sparse-checkout: .github/workflows/
          sparse-checkout-cone-mode: false

      - name: Resolve tag and find both build runs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── Resolve tag ──────────────────────────────────────────
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            echo "No tag specified, using latest release: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

          BRANCH="omnipkg-ffi-v0.10.8"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # ── Get commit SHA for this tag ───────────────────────────
          OBJ_TYPE=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.type')
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')
          if [ "$OBJ_TYPE" = "tag" ]; then
            TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags/$TAG_SHA" --jq '.object.sha')
          fi
          echo "Tag SHA: $TAG_SHA"

          # ── Find or trigger run by SHA on ffi branch ─────────────
          EXPECTED_VER="${TAG#v}"
          echo "Expected version: $EXPECTED_VER"

          find_run() {
            # Check run inputs for matching tag — display_title never contains it
            local WF=$1
            echo "  Scanning $WF for successful run with input tag=$TAG..." >&2
            local IDS
            IDS=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=20" \
              --jq ".workflow_runs[] | select(.conclusion == \"success\") | .id" 2>/dev/null)
            for RUN_ID in $IDS; do
              RUN_INPUT_TAG=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                --jq '.inputs.tag // ""' 2>/dev/null)
              echo "  run $RUN_ID input.tag=$RUN_INPUT_TAG" >&2
              if [ "$RUN_INPUT_TAG" = "$TAG" ]; then
                echo "$RUN_ID"
                return
              fi
            done
          }

          dispatch_run() {
            local WF=$1
            local BEFORE
            BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "  $WF → dispatching on $BRANCH with tag=$TAG..." >&2
            gh api "repos/${{ github.repository }}/actions/workflows/$WF/dispatches" \
              -f ref="$BRANCH" \
              -f inputs[tag]="$TAG"
            echo "$BEFORE" > "/tmp/before_${WF//\//_}"
          }

          find_or_dispatch() {
            local WF=$1
            local ID
            ID=$(find_run "$WF")
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              echo "  $WF → reusing existing run $ID" >&2
              echo "$ID" > "/tmp/run_id_${WF//\//_}"
            else
              dispatch_run "$WF"
            fi
          }

          wait_for_dispatched() {
            local WF=$1
            # If already resolved (reused), skip
            if [ -f "/tmp/run_id_${WF//\//_}" ]; then return; fi
            local BEFORE
            BEFORE=$(cat "/tmp/before_${WF//\//_}")
            local NEW_ID ATTEMPTS=0
            while true; do
              NEW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=10" \
                --jq ".workflow_runs[] | select(.created_at > \"$BEFORE\") | .id" \
                2>/dev/null | head -1)
              if [ -n "$NEW_ID" ] && [ "$NEW_ID" != "null" ]; then
                echo "  $WF → dispatched run $NEW_ID" >&2
                echo "$NEW_ID" > "/tmp/run_id_${WF//\//_}"
                return
              fi
              ATTEMPTS=$((ATTEMPTS+1))
              echo "  waiting for $WF run to appear... attempt $ATTEMPTS" >&2
              [ $ATTEMPTS -gt 24 ] && { echo "❌ Could not find dispatched run for $WF" >&2; exit 1; }
              sleep 10
            done
          }

          find_dispatched_run() {
            local WF=$1
            cat "/tmp/run_id_${WF//\//_}" 2>/dev/null
          }

          # Check for existing then dispatch both before waiting on either
          find_or_dispatch "build-wheels.yml"
          find_or_dispatch "build-wheels-extended.yml"
          wait_for_dispatched "build-wheels.yml"
          wait_for_dispatched "build-wheels-extended.yml"
          
          wait_for_run() {
            local WF=$1
            local ELAPSED=0
            local ID
            ID=$(find_dispatched_run "$WF")
            while true; do
              if [ -n "$ID" ] && [ "$ID" != "null" ]; then
                STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.status')
                CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.conclusion // ""')
                echo "  [${ELAPSED}s] $WF $ID: $STATUS/$CONCLUSION" >&2
                if [ "$STATUS" = "completed" ]; then
                  [ "$CONCLUSION" = "success" ] && { echo "$ID"; return; }
                  echo "❌ $WF failed: $CONCLUSION" >&2; exit 1
                fi
              fi
              sleep 30; ELAPSED=$((ELAPSED+30))
            done
          }
          
          # Poll both in background, collect results
          STD_ID=$(wait_for_run "build-wheels.yml") &
          STD_PID=$!
          EXT_ID=$(wait_for_run "build-wheels-extended.yml") &
          EXT_PID=$!
          
          wait $STD_PID || echo "⚠️  Standard wheels failed or skipped"
          wait $EXT_PID || echo "⚠️  Extended wheels failed or skipped"
          
          # Re-capture since subshell vars don't export
          STD_ID=$(find_dispatched_run "build-wheels.yml")
          EXT_ID=$(find_dispatched_run "build-wheels-extended.yml")
          
          echo "std_run_id=$STD_ID" >> $GITHUB_OUTPUT
          echo "ext_run_id=$EXT_ID" >> $GITHUB_OUTPUT
          echo "Standard run: $STD_ID  |  Extended run: $EXT_ID"

      - name: Download standard wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels.yml
          run_id: ${{ steps.resolve.outputs.std_run_id }}
          name: wheels-*
          name_is_regexp: true
          path: dist/
          if_no_artifact_found: ignore
        continue-on-error: true
        id: dl_std

      - name: Download extended wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels-extended.yml
          run_id: ${{ steps.resolve.outputs.ext_run_id }}
          name: ext-wheels-*
          name_is_regexp: true
          path: dist/
          if_no_artifact_found: ignore
        continue-on-error: true
        id: dl_ext

      - name: Download sdist (from this run or previous)
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: publish.yml
          run_id: ${{ needs.build-sdist.outputs.reuse_run_id || github.run_id }}
          name: sdist
          path: dist/
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Check artifact results
        run: |
          STD_RUN="${{ steps.resolve.outputs.std_run_id }}"
          EXT_RUN="${{ steps.resolve.outputs.ext_run_id }}"
          echo "Standard run: $STD_RUN — $(ls dist/wheels-* 2>/dev/null | wc -l) artifact dirs"
          echo "Extended run: $EXT_RUN — $(ls dist/ext-wheels-* 2>/dev/null | wc -l) artifact dirs"
          TOTAL=$(find dist/ -name "*.whl" 2>/dev/null | wc -l)
          SDIST=$(find dist/ -name "*.tar.gz" 2>/dev/null | wc -l)
          echo "Total wheels found: $TOTAL"
          echo "Sdist found: $SDIST"
          if [ "$SDIST" = "0" ]; then
            echo "⚠️  No sdist found - sdist may already be on PyPI or build was skipped"
          fi
          if [ "$TOTAL" = "0" ] && [ "$SDIST" = "0" ]; then
            echo "All artifacts already on PyPI - nothing to upload."
            exit 0
          fi

      - name: Flatten wheels into dist/
        run: |
          echo "Before flatten:"
          ls dist/
          find dist/ -name "*.whl" -exec mv {} dist/ \; 2>/dev/null || true
          find dist/ -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          echo "After flatten:"
          ls -lh dist/
          echo "Total wheels: $(ls dist/*.whl 2>/dev/null | wc -l)"

      - name: Remove wheels already on PyPI or with unsupported tags
        run: |
          UNSUPPORTED_PATTERNS=(
            "manylinux_2_36_loongarch64"
          )
          for pattern in "${UNSUPPORTED_PATTERNS[@]}"; do
            for f in dist/*${pattern}*.whl; do
              [ -f "$f" ] || continue
              echo "  Removing unsupported platform: $(basename $f)"
              rm -f "$f" "$f.publish.attestation"
            done
          done
          echo "Removing all pre-existing attestation files..."
          find dist/ -name "*.attestation" -delete 2>/dev/null || true
          echo "DEBUG: full dist/ contents:"
          ls -la dist/ 2>/dev/null || echo "dist/ empty or missing"
          echo "DEBUG: whl count: $(find dist/ -name "*.whl" 2>/dev/null | wc -l)"
          echo "DEBUG: sdist count: $(find dist/ -name "*.tar.gz" 2>/dev/null | wc -l)"
          echo "DEBUG: VERSION=$(find dist/ -name "*.whl" 2>/dev/null | head -1 | grep -oP '(?<=uv_ffi-)[0-9][^-]+')"
          echo "DEBUG: next steps will check these counts"
          VERSION=$(find dist/ -name "*.whl" 2>/dev/null | head -1 | grep -oP '(?<=uv_ffi-)[0-9][^-]+' || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(find dist/ -name "*.tar.gz" 2>/dev/null | head -1 | grep -oP '(?<=uv_ffi-)[0-9][^-]+(?:\.[a-z]+[0-9]+)?' || true)
          fi
          if [ -z "$VERSION" ]; then
            echo "No wheels or sdist left in dist/, nothing to do"
            exit 0
          fi
          echo "Checking PyPI for version $VERSION..."
          EXISTING=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" \
            | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              for f in data.get('urls', []):
                  print(f['filename'])
              " 2>/dev/null || true)
          if [ -z "$EXISTING" ]; then
            echo "No existing files on PyPI for $VERSION, uploading all."
          else
            echo "Removing already-uploaded wheels from dist/..."
            while IFS= read -r fname; do
              if [ -f "dist/$fname" ]; then
                echo "  Removing: $fname"
                rm -f "dist/$fname"
              fi
            done <<< "$EXISTING"
          fi
          echo ""
          echo "Wheels to upload ($(ls dist/*.whl 2>/dev/null | wc -l) remaining):"
          ls dist/*.whl 2>/dev/null || true

      - name: Publish via OIDC (trusted publisher)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Clean attestations after OIDC failure
        if: steps.oidc.outcome == 'failure'
        run: |
          echo "OIDC failed — purging any generated attestations before fallback..."
          find dist/ -name "*.attestation" -delete 2>/dev/null || true
          echo "dist/ contents:"
          ls -lh dist/

      - name: Publish via API token (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
