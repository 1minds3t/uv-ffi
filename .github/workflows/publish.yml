name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.10.8.post4) — uses existing build-wheels artifacts'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-ffi
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Checkout current workflow from HEAD
        uses: actions/checkout@v4
        with:
          ref: omnipkg-ffi-v0.10.8
          sparse-checkout: .github/workflows/
          sparse-checkout-cone-mode: false

      - name: Resolve tag and find both build runs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── Resolve tag ──────────────────────────────────────────
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            echo "No tag specified, using latest release: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

          # ── Derive branch from tag ────────────────────────────────
          # v0.10.8.post4 → v0.10.8 → omnipkg-ffi-v0.10.8
          BASE_VER=$(echo "$TAG" | grep -oP 'v\d+\.\d+\.\d+' | head -1)
          BRANCH="omnipkg-ffi-${BASE_VER}"
          echo "Derived branch: $BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # ── Find run by branch ────────────────────────────────────
          bashTAG_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" --jq '.object.sha' 2>/dev/null)
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags/$TAG_SHA" --jq '.object.sha' 2>/dev/null || echo "$TAG_SHA")
          echo "Tag SHA: $TAG_SHA"
          
          find_or_trigger_run() {
            local WF=$1
            # Check for existing successful run matching this SHA
            local ID
            ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=20" \
              --jq ".workflow_runs[] | select(.conclusion == \"success\" and .head_sha == \"$TAG_SHA\") | .id" \
              2>/dev/null | head -1)
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              echo "  $WF → existing run $ID" >&2
              echo "$ID"
              return
            fi
          
            # Trigger it
            echo "  $WF → no run found for $TAG_SHA, triggering on $BRANCH..." >&2
            gh api "repos/${{ github.repository }}/actions/workflows/$WF/dispatches" \
              -f ref="$BRANCH" 2>/dev/null || true
          
            # Wait for it to appear and complete
            local ELAPSED=0
            while true; do
              ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=10" \
                --jq ".workflow_runs[] | select(.head_sha == \"$TAG_SHA\") | .id" \
                2>/dev/null | head -1)
              if [ -n "$ID" ] && [ "$ID" != "null" ]; then
                STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.status' 2>/dev/null)
                CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.conclusion // ""' 2>/dev/null)
                echo "  [${ELAPSED}s] $WF run $ID: $STATUS / $CONCLUSION" >&2
                if [ "$STATUS" = "completed" ]; then
                  [ "$CONCLUSION" = "success" ] && { echo "$ID"; return; }
                  echo "❌ $WF run failed: $CONCLUSION" >&2; exit 1
                fi
              fi
              sleep 30; ELAPSED=$((ELAPSED+30))
            done
          }
          
          STD_ID=$(find_or_trigger_run "build-wheels.yml")
          EXT_ID=$(find_or_trigger_run "build-wheels-extended.yml")

          STD_ID=$(find_run "build-wheels.yml")
          EXT_ID=$(find_run "build-wheels-extended.yml")
          echo "std_run_id=$STD_ID" >> $GITHUB_OUTPUT
          echo "ext_run_id=$EXT_ID" >> $GITHUB_OUTPUT
          echo "Standard run: $STD_ID  |  Extended run: $EXT_ID"

      - name: Wait for both builds to complete
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait_for_run() {
            local ID=$1 NAME=$2
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "⚠️  $NAME: no run found, skipping wait"
              return 0
            fi
            echo "Polling $NAME (run $ID)..."
            local ELAPSED=0
            while true; do
              STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.status' 2>/dev/null)
              CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.conclusion // ""' 2>/dev/null)
              echo "  [${ELAPSED}s] $NAME: status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] && { echo "✅ $NAME done"; return 0; }
                echo "❌ $NAME failed: $CONCLUSION"; exit 1
              fi
              sleep 30; ELAPSED=$((ELAPSED+30))
            done
          }
          wait_for_run "${{ steps.resolve.outputs.std_run_id }}" "build-wheels"
          wait_for_run "${{ steps.resolve.outputs.ext_run_id }}" "build-wheels-extended"

      - name: Verify artifacts exist (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in "${{ steps.resolve.outputs.std_run_id }}" "${{ steps.resolve.outputs.ext_run_id }}"; do
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "⚠️  No run ID found, skipping check"
              continue
            fi
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.total_count' 2>/dev/null)
            echo "Run $RUN_ID: $COUNT artifacts"
            if [ "$COUNT" -eq "0" ]; then
              echo "❌ No artifacts found for run $RUN_ID"
              exit 1
            fi
          done
          echo "✅ Artifacts verified for both runs"

      - name: Download standard wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels.yml
          run_id: ${{ steps.resolve.outputs.std_run_id }}
          name: wheels-*
          name_is_regexp: true
          path: dist/

      - name: Download extended wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels-extended.yml
          run_id: ${{ steps.resolve.outputs.ext_run_id }}
          name: ext-wheels-*
          name_is_regexp: true
          path: dist/

      - name: Flatten wheels into dist/
        run: |
          echo "Before flatten:"
          ls dist/
          find dist/ -name "*.whl" -exec mv {} dist/ \; 2>/dev/null || true
          find dist/ -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          echo "After flatten:"
          ls -lh dist/
          echo "Total wheels: $(ls dist/*.whl 2>/dev/null | wc -l)"

      - name: Remove wheels already on PyPI or with unsupported tags
        run: |
          UNSUPPORTED_PATTERNS=(
            "manylinux_2_36_loongarch64"
          )
          for pattern in "${UNSUPPORTED_PATTERNS[@]}"; do
            for f in dist/*${pattern}*.whl; do
              [ -f "$f" ] || continue
              echo "  Removing unsupported platform: $(basename $f)"
              rm -f "$f" "$f.publish.attestation"
            done
          done
          echo "Removing all pre-existing attestation files..."
          find dist/ -name "*.attestation" -delete
          VERSION=$(ls dist/*.whl 2>/dev/null | head -1 | grep -oP '(?<=uv_ffi-)[^-]+')
          if [ -z "$VERSION" ]; then
            echo "No wheels left in dist/, nothing to do"
            exit 0
          fi
          echo "Checking PyPI for version $VERSION..."
          EXISTING=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" \
            | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              for f in data.get('urls', []):
                  print(f['filename'])
              " 2>/dev/null || true)
          if [ -z "$EXISTING" ]; then
            echo "No existing files on PyPI for $VERSION, uploading all."
          else
            echo "Removing already-uploaded wheels from dist/..."
            while IFS= read -r fname; do
              if [ -f "dist/$fname" ]; then
                echo "  Removing: $fname"
                rm -f "dist/$fname"
              fi
            done <<< "$EXISTING"
          fi
          echo ""
          echo "Wheels to upload ($(ls dist/*.whl 2>/dev/null | wc -l) remaining):"
          ls dist/*.whl 2>/dev/null || echo "  (none — all already on PyPI)"

      - name: Publish via OIDC (trusted publisher)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Publish via API token (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
