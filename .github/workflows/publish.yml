name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.10.8.post4) — uses existing build-wheels artifacts'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build-sdist:
    name: "📦 Source Distribution"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check PyPI for existing sdist
        id: pypi_check
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version' crates/uv-ffi/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          fi
          SDIST="uv_ffi-${VERSION}.tar.gz"
          echo "Checking PyPI for $SDIST..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/uv-ffi/$VERSION/json")
          if [ "$HTTP" != "200" ]; then
            echo "Version $VERSION not on PyPI yet - building sdist"
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            FOUND=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" | python3 -c "import sys,json; files=[f['filename'] for f in json.load(sys.stdin).get('urls',[])]; print('found' if '${SDIST}' in files else 'missing')" 2>/dev/null)
            if [ "$FOUND" = "found" ]; then
              echo "sdist $SDIST already on PyPI - skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "sdist $SDIST not on PyPI - building"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Build sdist
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          command: sdist
          args: --out ${{ github.workspace }}/sdist/
      - uses: actions/upload-artifact@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          name: sdist
          path: sdist/

  pypi-publish:
    needs: build-sdist
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-ffi
    permissions:
      id-token: write
      actions: write
    steps:
      - name: Checkout current workflow from HEAD
        uses: actions/checkout@v4
        with:
          ref: omnipkg-ffi-v0.10.8
          sparse-checkout: .github/workflows/
          sparse-checkout-cone-mode: false

      - name: Resolve tag and find both build runs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ── Resolve tag ──────────────────────────────────────────
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            echo "No tag specified, using latest release: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

          BRANCH="omnipkg-ffi-v0.10.8"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          # ── Get commit SHA for this tag ───────────────────────────
          OBJ_TYPE=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.type')
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha')
          if [ "$OBJ_TYPE" = "tag" ]; then
            TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags/$TAG_SHA" --jq '.object.sha')
          fi
          echo "Tag SHA: $TAG_SHA"

          # ── Find or trigger run by SHA on ffi branch ─────────────
          find_run() {
            local WF=$1
            gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=20" \
              --jq ".workflow_runs[] | select(.conclusion == \"success\") | .id" \
              2>/dev/null | head -1
          }
          
          trigger_if_missing() {
            local WF=$1
            local ID
            ID=$(find_run "$WF")
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              echo "  $WF → existing run $ID" >&2
              echo "$ID" > "/tmp/run_id_${WF//\//_}"
            else
              echo "  $WF → triggering on $BRANCH..." >&2
              gh api "repos/${{ github.repository }}/actions/workflows/$WF/dispatches" \
                -f ref="$BRANCH" \
                -f inputs[tag]="$TAG"
              local BEFORE
              BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              sleep 20
              local NEW_ID ATTEMPTS=0
              while true; do
                NEW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=10" \
                  --jq ".workflow_runs[] | select(.created_at > \"$BEFORE\") | .id" \
                  2>/dev/null | head -1)
                [ -n "$NEW_ID" ] && [ "$NEW_ID" != "null" ] && break
                ATTEMPTS=$((ATTEMPTS+1))
                echo "  waiting for run to appear... attempt $ATTEMPTS" >&2
                [ $ATTEMPTS -gt 24 ] && { echo "❌ Could not find dispatched run for $WF" >&2; exit 1; }
                sleep 10
              done
              echo "$NEW_ID" > "/tmp/run_id_${WF//\//_}"
              echo "  $WF → dispatched run $NEW_ID" >&2
            fi
          }
          
          find_dispatched_run() {
            local WF=$1
            cat "/tmp/run_id_${WF//\//_}" 2>/dev/null
          }
          
          # Fire both dispatches before polling either
          trigger_if_missing "build-wheels.yml"
          trigger_if_missing "build-wheels-extended.yml"
          
          wait_for_run() {
            local WF=$1
            local ELAPSED=0
            local ID
            ID=$(find_dispatched_run "$WF")
            while true; do
              if [ -n "$ID" ] && [ "$ID" != "null" ]; then
                STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.status')
                CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.conclusion // ""')
                echo "  [${ELAPSED}s] $WF $ID: $STATUS/$CONCLUSION" >&2
                if [ "$STATUS" = "completed" ]; then
                  [ "$CONCLUSION" = "success" ] && { echo "$ID"; return; }
                  echo "❌ $WF failed: $CONCLUSION" >&2; exit 1
                fi
              fi
              sleep 30; ELAPSED=$((ELAPSED+30))
            done
          }
          
          # Poll both in background, collect results
          STD_ID=$(wait_for_run "build-wheels.yml") &
          STD_PID=$!
          EXT_ID=$(wait_for_run "build-wheels-extended.yml") &
          EXT_PID=$!
          
          wait $STD_PID || echo "⚠️  Standard wheels failed or skipped"
          wait $EXT_PID || echo "⚠️  Extended wheels failed or skipped"
          
          # Re-capture since subshell vars don't export
          STD_ID=$(find_dispatched_run "build-wheels.yml")
          EXT_ID=$(find_dispatched_run "build-wheels-extended.yml")
          
          echo "std_run_id=$STD_ID" >> $GITHUB_OUTPUT
          echo "ext_run_id=$EXT_ID" >> $GITHUB_OUTPUT
          echo "Standard run: $STD_ID  |  Extended run: $EXT_ID"

      - name: Download standard wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels.yml
          run_id: ${{ steps.resolve.outputs.std_run_id }}
          name: wheels-*
          name_is_regexp: true
          path: dist/
          if_no_artifact_found: ignore
        continue-on-error: true
        id: dl_std

      - name: Download extended wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels-extended.yml
          run_id: ${{ steps.resolve.outputs.ext_run_id }}
          name: ext-wheels-*
          name_is_regexp: true
          path: dist/
          if_no_artifact_found: ignore
        continue-on-error: true
        id: dl_ext

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
        continue-on-error: true

      - name: Check artifact results
        run: |
          STD_RUN="${{ steps.resolve.outputs.std_run_id }}"
          EXT_RUN="${{ steps.resolve.outputs.ext_run_id }}"
          echo "Standard run: $STD_RUN — $(ls dist/wheels-* 2>/dev/null | wc -l) artifact dirs"
          echo "Extended run: $EXT_RUN — $(ls dist/ext-wheels-* 2>/dev/null | wc -l) artifact dirs"
          TOTAL=$(find dist/ -name "*.whl" 2>/dev/null | wc -l)
          SDIST=$(find dist/ -name "*.tar.gz" 2>/dev/null | wc -l)
          echo "Total wheels found: $TOTAL"
          echo "Sdist found: $SDIST"
          if [ "$SDIST" = "0" ]; then
            echo "⚠️  No sdist found - sdist may already be on PyPI or build was skipped"
          fi
          if [ "$TOTAL" = "0" ] && [ "$SDIST" = "0" ]; then
            echo "All artifacts already on PyPI - nothing to upload."
            exit 0
          fi

      - name: Flatten wheels into dist/
        run: |
          echo "Before flatten:"
          ls dist/
          find dist/ -name "*.whl" -exec mv {} dist/ \; 2>/dev/null || true
          find dist/ -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          echo "After flatten:"
          ls -lh dist/
          echo "Total wheels: $(ls dist/*.whl 2>/dev/null | wc -l)"

      - name: Remove wheels already on PyPI or with unsupported tags
        run: |
          UNSUPPORTED_PATTERNS=(
            "manylinux_2_36_loongarch64"
          )
          for pattern in "${UNSUPPORTED_PATTERNS[@]}"; do
            for f in dist/*${pattern}*.whl; do
              [ -f "$f" ] || continue
              echo "  Removing unsupported platform: $(basename $f)"
              rm -f "$f" "$f.publish.attestation"
            done
          done
          echo "Removing all pre-existing attestation files..."
          find dist/ -name "*.attestation" -delete
          VERSION=$(ls dist/*.whl 2>/dev/null | head -1 | grep -oP '(?<=uv_ffi-)[^-]+')
          if [ -z "$VERSION" ]; then
            echo "No wheels left in dist/, nothing to do"
            exit 0
          fi
          echo "Checking PyPI for version $VERSION..."
          EXISTING=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" \
            | python3 -c "
              import sys, json
              data = json.load(sys.stdin)
              for f in data.get('urls', []):
                  print(f['filename'])
              " 2>/dev/null || true)
          if [ -z "$EXISTING" ]; then
            echo "No existing files on PyPI for $VERSION, uploading all."
          else
            echo "Removing already-uploaded wheels from dist/..."
            while IFS= read -r fname; do
              if [ -f "dist/$fname" ]; then
                echo "  Removing: $fname"
                rm -f "dist/$fname"
              fi
            done <<< "$EXISTING"
          fi
          echo ""
          echo "Wheels to upload ($(ls dist/*.whl 2>/dev/null | wc -l) remaining):"
          ls dist/*.whl 2>/dev/null || true

      - name: Publish via OIDC (trusted publisher)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Publish via API token (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
