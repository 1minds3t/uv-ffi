name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.10.8) — uses existing build-wheels artifacts'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-ffi
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Checkout current workflow from HEAD
        uses: actions/checkout@v4
        with:
          ref: omnipkg-ffi-v0.10.8
          sparse-checkout: .github/workflows/
          sparse-checkout-cone-mode: false

      - name: Resolve tag and find both build runs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            echo "No tag specified, using latest release: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

          find_run() {
            local WF=$1
            local ID
            ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?per_page=30" \
              --jq ".workflow_runs[] | select(.head_branch == \"$TAG\" or .display_title == \"$TAG\" or (.head_commit.message | test(\"$TAG\"))) | .id" \
              2>/dev/null | head -1)
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?status=success&per_page=5" \
                --jq '.workflow_runs[0].id' 2>/dev/null)
              echo "  $WF: tag match not found, falling back to latest success: $ID" >&2
            fi
            echo "$ID"
          }

          STD_ID=$(find_run "build-wheels.yml")
          EXT_ID=$(find_run "build-wheels-extended.yml")
          echo "std_run_id=$STD_ID" >> $GITHUB_OUTPUT
          echo "ext_run_id=$EXT_ID" >> $GITHUB_OUTPUT
          echo "Standard run: $STD_ID  |  Extended run: $EXT_ID"

      - name: Wait for both builds to complete
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait_for_run() {
            local ID=$1 NAME=$2
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "⚠️  $NAME: no run found, skipping wait"
              return 0
            fi
            echo "Polling $NAME (run $ID)..."
            local ELAPSED=0
            while true; do
              STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.status' 2>/dev/null)
              CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$ID" --jq '.conclusion // ""' 2>/dev/null)
              echo "  [${ELAPSED}s] $NAME: status=$STATUS conclusion=$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] && { echo "✅ $NAME done"; return 0; }
                echo "❌ $NAME failed: $CONCLUSION"; exit 1
              fi
              sleep 30; ELAPSED=$((ELAPSED+30))
            done
          }
          wait_for_run "${{ steps.resolve.outputs.std_run_id }}" "build-wheels"
          wait_for_run "${{ steps.resolve.outputs.ext_run_id }}" "build-wheels-extended"

      - name: Verify artifacts exist (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in "${{ steps.resolve.outputs.std_run_id }}" "${{ steps.resolve.outputs.ext_run_id }}"; do
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "⚠️  No run ID found, skipping check"
              continue
            fi
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.total_count' 2>/dev/null)
            echo "Run $RUN_ID: $COUNT artifacts"
            if [ "$COUNT" -eq "0" ]; then
              echo "❌ No artifacts found for run $RUN_ID"
              exit 1
            fi
          done
          echo "✅ Artifacts verified for both runs"

      - name: Download standard wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels.yml
          run_id: ${{ steps.resolve.outputs.std_run_id }}
          name: wheels-*
          name_is_regexp: true
          merge_multiple: true
          path: dist/

      - name: Download extended wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels-extended.yml
          run_id: ${{ steps.resolve.outputs.ext_run_id }}
          name: ext-wheels-*
          name_is_regexp: true
          merge_multiple: true
          path: dist/

      - name: Flatten wheels into dist/
        run: |
          echo "Before flatten:"
          ls dist/
          find dist/ -name "*.whl" -exec mv {} dist/ \; 2>/dev/null || true
          find dist/ -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          echo "After flatten:"
          ls -lh dist/
          echo "Total wheels: $(ls dist/*.whl 2>/dev/null | wc -l)"

      - name: Remove wheels already on PyPI
        run: |
          VERSION=$(ls dist/*.whl | head -1 | grep -oP '(?<=uv_ffi-)[^-]+')
          echo "Checking PyPI for version $VERSION..."
          EXISTING=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" \
            | python3 -c "import sys,json; data=json.load(sys.stdin); \
              files=data.get('urls',[]); \
              [print(f['filename']) for f in files]" 2>/dev/null || true)
          
          if [ -z "$EXISTING" ]; then
            echo "No existing files on PyPI for $VERSION, uploading all."
          else
            echo "Existing files on PyPI:"
            echo "$EXISTING"
            echo ""
            echo "Removing already-uploaded wheels from dist/..."
            while IFS= read -r fname; do
              if [ -f "dist/$fname" ]; then
                echo "  Removing: $fname"
                rm "dist/$fname"
                rm -f "dist/$fname.publish.attestation"
              fi
            done <<< "$EXISTING"
          fi
          
          echo ""
          echo "Wheels to upload ($(ls dist/*.whl 2>/dev/null | wc -l) remaining):"
          ls dist/*.whl 2>/dev/null || echo "  (none — all already on PyPI)"

      - name: Publish via OIDC (trusted publisher)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip_existing: true   # <-- add this

      - name: Publish via API token (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
