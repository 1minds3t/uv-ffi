name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-ffi
    permissions:
      id-token: write

    steps:
      - name: Download wheels from build-wheels workflow
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels.yml
          commit: ${{ github.sha }}
          name: wheels-*
          name_is_regexp: true
          merge_multiple: true
          path: dist/
          if_no_artifact_found: warn

      - name: List wheels to publish
        run: |
          echo "Wheels found:"
          ls -lh dist/ || echo "No wheels found in dist/"

      - name: Publish via OIDC (trusted publisher)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish via API token (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
