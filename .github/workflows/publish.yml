# publish.yml — dispatches builds and exits immediately
name: Publish to PyPI (uv-ffi)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.10.8.post4)'
        required: false
        default: ''
      source_only:
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  build-sdist:
    name: "📦 Source Distribution"
    runs-on: ubuntu-latest
    steps:
      - name: Check PyPI for existing sdist
        id: pypi_check
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          SDIST="uv_ffi-${VERSION}.tar.gz"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/uv-ffi/$VERSION/json")
          if [ "$HTTP" = "200" ]; then
            FOUND=$(curl -s "https://pypi.org/pypi/uv-ffi/$VERSION/json" | python3 -c "
          import sys,json; files=[f['filename'] for f in json.load(sys.stdin).get('urls',[])]
          print('found' if '${SDIST}' in files else 'missing')" 2>/dev/null)
            [ "$FOUND" = "found" ] && echo "skip=true" >> $GITHUB_OUTPUT && exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build sdist
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          command: sdist
          args: --out ${{ github.workspace }}/sdist/

      - uses: actions/upload-artifact@v4
        if: steps.pypi_check.outputs.skip == 'false'
        with:
          name: sdist
          path: sdist/

  dispatch-builds:
    name: "🚀 Dispatch wheel builds"
    runs-on: ubuntu-latest
    if: inputs.source_only != 'true'
    outputs:
      tag: ${{ steps.dispatch.outputs.tag }}
    steps:
      - name: Checkout workflow files
        uses: actions/checkout@v4
        with:
          ref: omnipkg-ffi-v0.10.8
          sparse-checkout: .github/workflows/
          sparse-checkout-cone-mode: false

      - name: Dispatch or reuse build runs
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          BRANCH="omnipkg-ffi-v0.10.8"

          find_run() {
            local WF=$1
            local RUN_IDS
            RUN_IDS=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=20" \
              --jq ".workflow_runs[] | select(.conclusion == \"success\") | .id")
            for RUN_ID in $RUN_IDS; do
              INPUT_TAG=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.inputs.tag // ""' 2>/dev/null)
              if [ "$INPUT_TAG" = "$TAG" ]; then
                echo "$RUN_ID"
                return
              fi
            done
          }

          dispatch_and_record() {
            local WF=$1
            local EXISTING
            EXISTING=$(find_run "$WF")
            if [ -n "$EXISTING" ]; then
              echo "  $WF → reusing run $EXISTING"
            else
              BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              gh api "repos/${{ github.repository }}/actions/workflows/$WF/dispatches" \
                -f ref="$BRANCH" -f inputs[tag]="$TAG"
              echo "  $WF → dispatched, waiting for run ID..."
              ATTEMPTS=0
              while true; do
                NEW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?branch=$BRANCH&per_page=10" \
                  --jq ".workflow_runs[] | select(.created_at > \"$BEFORE\") | .id" 2>/dev/null | head -1)
                [ -n "$NEW_ID" ] && echo "  $WF → run $NEW_ID" && break
                ATTEMPTS=$((ATTEMPTS+1))
                [ $ATTEMPTS -gt 30 ] && echo "❌ timeout waiting for $WF run" && exit 1
                sleep 10
              done
            fi
          }

          dispatch_and_record "build-wheels.yml"
          dispatch_and_record "build-wheels-extended.yml"
          dispatch_and_record "build-wheels-exotic.yml"
          echo "✅ All three build workflows dispatched — publish-collect.yml will fire when they complete"
