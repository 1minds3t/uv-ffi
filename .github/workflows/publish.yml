name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-ffi
    permissions:
      id-token: write
      actions: read

    steps:
      - name: Wait for wheel artifacts to exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Polling for wheel artifacts from build-wheels.yml..."
          TIMEOUT=7200
          INTERVAL=30
          ELAPSED=0

          while true; do
            # Find most recent build-wheels run triggered by a release event
            RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build-wheels.yml/runs?event=release&per_page=5" \
              --jq '.workflow_runs[0].id' 2>/dev/null)

            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "  [${ELAPSED}s] No build-wheels run found yet..."
            else
              STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                --jq '.status' 2>/dev/null)
              CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
                --jq '.conclusion // ""' 2>/dev/null)

              echo "  [${ELAPSED}s] run=$RUN_ID status=$STATUS conclusion=$CONCLUSION"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  # Double-check artifacts actually exist
                  ARTIFACT_COUNT=$(gh api \
                    "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
                    --jq '.total_count' 2>/dev/null)
                  echo "  Artifacts found: $ARTIFACT_COUNT"
                  if [ "$ARTIFACT_COUNT" -gt "0" ]; then
                    echo "✅ Wheels ready!"
                    break
                  else
                    echo "  Run succeeded but no artifacts yet, waiting..."
                  fi
                else
                  echo "❌ build-wheels failed: $CONCLUSION"
                  exit 1
                fi
              fi
            fi

            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "❌ Timed out after ${TIMEOUT}s waiting for wheels"
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

      - name: Download wheels
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-wheels.yml
          workflow_conclusion: success
          name: wheels-*
          name_is_regexp: true
          merge_multiple: true
          path: dist/
          if_no_artifact_found: fail

      - name: List wheels
        run: |
          echo "Wheels to publish:"
          ls -lh dist/

      - name: Publish via OIDC (trusted publisher)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish via API token (fallback)
        if: steps.oidc.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
