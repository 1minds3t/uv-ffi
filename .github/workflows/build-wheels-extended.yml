name: "🔧 Build uv-ffi Wheels (Extended)"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
        tag:
          description: 'Tag to build (e.g. v0.10.7)'
          required: false
          default: ''

jobs:
  build-linux-glibc-2_17:
    name: "glibc 2.17 • ${{ matrix.target }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - i686
          - aarch64
          - armv7
          - ppc64le
          - s390x-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: bash
        run: |
          VERSION=$(grep -m1 'version' crates/uv-ffi/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Checking PyPI for uv-ffi==$VERSION..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/uv-ffi/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION already on PyPI - skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not on PyPI - proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU (cross targets)
        if: matrix.target != 'x86_64' && matrix.target != 'i686'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels (manylinux_2_17)
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          target: ${{ matrix.target }}
          manylinux: "2_17"
          args: --release --out ${{ github.workspace }}/wheels/ --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
          CFLAGS_aarch64_unknown_linux_gnu: "-march=armv8-a"
          CFLAGS_armv7_unknown_linux_gnueabihf: "-march=armv7-a"

      - name: Upload wheels
        if: steps.pypi_check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: "ext-wheels-linux-glibc217-${{ matrix.target }}"
          path: wheels/
          if-no-files-found: warn

  build-linux-musl:
    name: "musl 1.2 • ${{ matrix.target }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - i686
          - aarch64
          - armv7
          - ppc64le
          - s390x-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: bash
        run: |
          VERSION=$(grep -m1 'version' crates/uv-ffi/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Checking PyPI for uv-ffi==$VERSION..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/uv-ffi/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION already on PyPI - skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not on PyPI - proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
