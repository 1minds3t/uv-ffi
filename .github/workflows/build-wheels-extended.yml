  build-linux-loongarch64:
    name: "loongarch64 glibc 2.36"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: bash
        run: |
          VERSION=$(grep -m1 'version' crates/uv-ffi/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Checking PyPI for uv-ffi==$VERSION..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/uv-ffi/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION already on PyPI - skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not on PyPI - proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels (manylinux_2_36)
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          target: loongarch64-unknown-linux-gnu
          manylinux: "2_36"
          args: --release --out ${{ github.workspace }}/wheels/ --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Upload wheels
        if: steps.pypi_check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: "ext-wheels-linux-loongarch64"
          path: wheels/
          if-no-files-found: warn

  build-macos-universal2:
    name: "macOS universal2"
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }} 
      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: bash
        run: |
          VERSION=$(grep -m1 'version' crates/uv-ffi/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Checking PyPI for uv-ffi==$VERSION..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/uv-ffi/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION already on PyPI - skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not on PyPI - proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build universal2 wheel
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          target: universal2-apple-darwin
          args: --release --out ${{ github.workspace }}/wheels/ --interpreter python${{ matrix.python }}
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Upload wheels
        if: steps.pypi_check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: "ext-wheels-macos-universal2-py${{ matrix.python }}"
          path: wheels/
          if-no-files-found: warn

  build-windows-i686:
    name: "Windows i686 • py${{ matrix.python }}"
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
        # Logic: Use the input tag if provided, otherwise use the event ref (the release tag)
          ref: ${{ github.event.inputs.tag || github.ref }} 
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x86

      - name: Check PyPI for existing wheel
        id: pypi_check
        shell: powershell
        run: |
          $version = (Select-String -Path "crates\uv-ffi\Cargo.toml" -Pattern 'version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "Checking PyPI for uv-ffi==$version..."
          try {
            Invoke-WebRequest -Uri "https://pypi.org/pypi/uv-ffi/$version/json" -Method Head -UseBasicParsing -ErrorAction Stop | Out-Null
            Write-Host "Version $version already on PyPI - skipping build"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } catch {
            Write-Host "Version $version not on PyPI - proceeding"
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build wheel (i686)
        if: steps.pypi_check.outputs.skip == 'false'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/uv-ffi
          target: i686-pc-windows-msvc
          args: --release --out ${{ github.workspace }}\wheels\ --interpreter python${{ matrix.python }}
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

      - name: Upload wheels
        if: steps.pypi_check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: "ext-wheels-windows-i686-py${{ matrix.python }}"
          path: wheels/
          if-no-files-found: warn

  collect-wheels:
    name: "Collect all extended wheels"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build-linux-glibc-2_17
      - build-linux-musl
      - build-linux-riscv64
      - build-linux-loongarch64
      - build-macos-universal2
      - build-windows-i686
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "ext-wheels-*"
          path: all-wheels/
          merge-multiple: true

      - name: List collected wheels
        run: |
          echo "=== Extended wheel build results ==="
          find all-wheels/ -name "*.whl" | sort | tee wheel-list.txt
          echo ""
          echo "Total wheels: $(wc -l < wheel-list.txt)"

      - name: Log job outcomes
        run: |
          echo "Job results:"
          echo "  glibc-2_17  : ${{ needs.build-linux-glibc-2_17.result }}"
          echo "  musl        : ${{ needs.build-linux-musl.result }}"
          echo "  riscv64     : ${{ needs.build-linux-riscv64.result }}"
          echo "  loongarch64 : ${{ needs.build-linux-loongarch64.result }}"
          echo "  macos-uni2  : ${{ needs.build-macos-universal2.result }}"
          echo "  windows-i686: ${{ needs.build-windows-i686.result }}"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: "ext-wheels-ALL"
          path: all-wheels/
          if-no-files-found: warn
